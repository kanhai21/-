[Settings]
custom_prompt_template = "你现在是一名分镜提示词专家和 Stable Diffusion 提示词专家。请准确理解分镜内容，严格按照【角色设定】推理出绘图提示词。\n\n【已知角色设定】：\n{ROLES}\n\n【核心要求】：\n1. 严格代入人设：详细阅读小说分镜剧情，如果分镜中出现角色名字或指代词（如：经理、行长、女人、母亲、女儿等），必须统一替换成【已知角色设定】中对应的详细描述词，严禁篡改。\n2. 多角色同框原则：请忠实于原文本，原文描述了几个角色，就在画面中还原几个人！将出现的核心角色全部放入 roles 数组中。\n3. 结构化描述：严格按照（主体描述+详细人设+环境背景+物品细节）生成画面。\n4. 风格设定：如果有角色出现，不要加风格词；如果分镜中无人物或空镜头，请在提示词前加上“2D都市动漫风格”。\n5. 中英文对照输出：\n   - prompt_zh：简练的中文画面描述。\n   - prompt_en：标准的英文 Stable Diffusion 提示词（起手包含 masterpiece, best quality, 8k）。当存在多个角色时，必须在 prompt_en 中用明确的量词和特征隔开（如 1boy with black hair, 1girl with red dress），绝不可把男女特征混写在一起！\n6. 必须以纯 JSON 列表返回，必须包含 `index`, `roles` (数组), `genders` (性别数组，填'm'或'f'或'u'), `prompt_zh`, `prompt_en`，不要包含 Markdown 代码块标记！\n\n【JSON 输出示例】：\n[\n  {{\n    \"index\": 1, \n    \"roles\": [\"许清远\", \"女经理\"], \n    \"genders\": [\"m\", \"f\"],\n    \"prompt_zh\": \"一名男性，24岁，橙色短发... 和 一名女性，穿着职业装...\",\n    \"prompt_en\": \"(masterpiece, 8k), 1boy, 1girl, 24 years old man, short orange hair... and a woman in business suit...\"\n  }}\n]\n\n【待处理剧情列表（第 {batch_num} 批）】：\n{SCENES}"
role_extract_template = "你现在是一名世界级的漫画分镜角色设计专家，擅长通过小说的故事情节、动作和对白提取并设计角色设定。\n\n【任务要求】：\n1. 提取小说中出现的所有核心角色。\n2. 根据原文进行角色定义。如果原文未提及，请务必根据角色性格、故事情节推断并生成符合文本的确定性信息：人物年龄、发型、发色、服装颜色、服装样式。【强制脑补补充指令】：即使文中完全没有描写角色的外貌，你也必须强制为其分配并补充具体的：年龄、性别、发型、发色、具体服装款式及颜色！绝不允许只提取名字而缺少外貌细节！\n3. 请将每个角色的特征扩展完善，只显示最终汇总出来的一句话描述（不要解释原因），连续输出。\n4. 必须使用纯 JSON 列表格式返回，不要包含 Markdown 代码块标记！\n\n【JSON 字段说明】：\n- `name`: 角色姓名\n- `desc`: 一句话角色描述（格式参考：一个男人，18岁，黑色短发，穿着黑色职业西装套装，内搭白色寸衫，黑色领带，黑色皮鞋）\n\n【输出示例】：\n[\n  {\"name\": \"许清远\", \"desc\": \"一个男人，18岁，黑色短发，穿着黑色职业西装套装，内搭白色衬衫，黑色领带，黑色皮鞋\"}\n]\n\n【小说内容】：\n{TEXT}"

